name: Apply data migration refactor

on:
  push:
    branches: ["ai/data-migration-refactor"]
    paths:
      - "scripts/apply_data_migration_refactor.py"
      - ".github/workflows/apply-data-migration-refactor.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@v4
        with:
          ref: ai/data-migration-refactor

      - name: Apply source refactor
        run: python scripts/apply_data_migration_refactor.py

      - name: Compile Python changes
        run: python -m py_compile desktop/restaurant_manager/server.py desktop/restaurant_manager/migration_package.py desktop/restaurant_manager/database.py

      - name: Run migration tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=desktop python -m pytest desktop/tests/test_migration_package.py desktop/tests/test_database.py -q

      - name: Build web application
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify asset expenses and system migration"
          git push origin HEAD:ai/data-migration-refactor

# trigger: default branch workflow registered
