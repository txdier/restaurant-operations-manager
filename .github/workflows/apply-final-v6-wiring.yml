name: Apply final v6 desktop wiring

on:
  push:
    branches:
      - refactor/schema-v6-storage
    paths:
      - ".github/workflows/apply-final-v6-wiring.yml"
      - "scripts/apply_final_v6_wiring.py"

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/schema-v6-storage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final page wiring
        run: python scripts/apply_final_v6_wiring.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified wiring
        run: |
          rm .github/workflows/apply-final-v6-wiring.yml scripts/apply_final_v6_wiring.py
          git config user.name "Q"
          git config user.email "30993382+txdier@users.noreply.github.com"
          git add app/page.tsx .github/workflows/apply-final-v6-wiring.yml scripts/apply_final_v6_wiring.py
          git commit -m "feat: finish relational desktop wiring and lightweight bootstrap"
          git push origin HEAD:refactor/schema-v6-storage
