name: Apply final v6 desktop wiring

on:
  push:
    branches: [refactor/schema-v6-storage]
    paths:
      - ".github/workflows/apply-final-v6-wiring.yml"

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/schema-v6-storage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire lightweight desktop bootstrap and remaining v2 pages
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import {desktopRequest,isDesktop,loadDesktopState,saveDesktopState} from "./desktop-api";',
              'import {desktopRequest,isDesktop,loadDesktopBootstrap,patchDesktopSettings,saveSaleCategoriesV2,saveExpenseCategoriesV2} from "./desktop-api";',
              'desktop api import',
          )
          replace_once(
              'import SalesV2 from "./sales-v2";',
              'import SalesV2 from "./sales-v2";\nimport StocktakeV2 from "./stocktake-v2";\nimport RemindersV2 from "./reminders-v2";\nimport PayrollV2 from "./payroll-v2";\nimport SuppliersV2 from "./suppliers-v2";',
              'v2 page imports',
          )

          old_state = ' const [locked,setLocked]=useState(()=>isDesktop()),[hydrated,setHydrated]=useState(false),saveTimer=useRef<ReturnType<typeof setTimeout>|null>(null),idleTimer=useRef<ReturnType<typeof setTimeout>|null>(null),lastActivity=useRef(Date.now());'
          new_state = ' const [locked,setLocked]=useState(()=>isDesktop()),[hasPassword,setHasPassword]=useState(false),[hydrated,setHydrated]=useState(false),saveTimer=useRef<ReturnType<typeof setTimeout>|null>(null),idleTimer=useRef<ReturnType<typeof setTimeout>|null>(null),lastActivity=useRef(Date.now()),settingsSnapshot=useRef(""),saleCategoriesSnapshot=useRef(""),expenseCategoriesSnapshot=useRef("");'
          replace_once(old_state, new_state, 'home security state')

          old_load = ''' useEffect(()=>{(async()=>{try{const x=isDesktop()?await loadDesktopState():JSON.parse(localStorage.getItem("restaurant-v1")||"null");if(x){if(x.incomeRecords?.length){const records=x.incomeRecords.map((r:any,index:number)=>normalizeIncome({...r,id:r.id||index+1}));setIncomeRecords(records);setIncome(records.find((r:IncomeRecord)=>r.entryMode==="day"&&r.date===today)||blankIncome())}else if(x.income){const current=normalizeIncome({...x.income,id:x.income.id||1});setIncomeRecords([current]);setIncome(current)}if(x.expenses)setExpenses(x.expenses);if(x.products)setProducts(x.products);if(x.stocktakes)setStocktakes(x.stocktakes);if(x.salesRecords)setSalesRecords(x.salesRecords);if(x.reminders)setReminders(x.reminders);if(x.saleCategories)setSaleCategories(x.saleCategories);if(x.expenseCategories)setExpenseCategories(x.expenseCategories);if(x.employees)setEmployees(x.employees);if(x.payrolls){setPayrolls(x.payrolls);const current=x.payrolls.find((r:PayrollSnapshot)=>r.month===today.slice(0,7));if(current)setPayroll(current)}else if(x.payroll)setPayroll(x.payroll);if(x.suppliers)setSuppliers(x.suppliers);if(x.assets)setAssets(x.assets);if(x.settings)setSettings((s:any)=>({...s,...x.settings}))}}catch(e:any){setToast(`数据加载失败：${e.message}`)}finally{setHydrated(true)}})()},[]);'''
          new_load = ''' useEffect(()=>{(async()=>{try{if(isDesktop()){const x=await loadDesktopBootstrap(),nextSettings={...settings,...x.settings};setSettings(nextSettings);setSaleCategories(x.saleCategories||[]);setExpenseCategories(x.expenseCategories||[]);settingsSnapshot.current=JSON.stringify(nextSettings);saleCategoriesSnapshot.current=JSON.stringify(x.saleCategories||[]);expenseCategoriesSnapshot.current=JSON.stringify(x.expenseCategories||[]);const configured=Boolean(x.security?.hasPassword);setHasPassword(configured);setLocked(configured)}else{const x=JSON.parse(localStorage.getItem("restaurant-v1")||"null");if(x){if(x.incomeRecords?.length){const records=x.incomeRecords.map((r:any,index:number)=>normalizeIncome({...r,id:r.id||index+1}));setIncomeRecords(records);setIncome(records.find((r:IncomeRecord)=>r.entryMode==="day"&&r.date===today)||blankIncome())}else if(x.income){const current=normalizeIncome({...x.income,id:x.income.id||1});setIncomeRecords([current]);setIncome(current)}if(x.expenses)setExpenses(x.expenses);if(x.products)setProducts(x.products);if(x.stocktakes)setStocktakes(x.stocktakes);if(x.salesRecords)setSalesRecords(x.salesRecords);if(x.reminders)setReminders(x.reminders);if(x.saleCategories)setSaleCategories(x.saleCategories);if(x.expenseCategories)setExpenseCategories(x.expenseCategories);if(x.employees)setEmployees(x.employees);if(x.payrolls){setPayrolls(x.payrolls);const current=x.payrolls.find((r:PayrollSnapshot)=>r.month===today.slice(0,7));if(current)setPayroll(current)}else if(x.payroll)setPayroll(x.payroll);if(x.suppliers)setSuppliers(x.suppliers);if(x.assets)setAssets(x.assets);if(x.settings)setSettings((s:any)=>({...s,...x.settings}))}}}catch(e:any){setToast(`数据加载失败：${e.message}`)}finally{setHydrated(true)}})()},[]);'''
          replace_once(old_load, new_load, 'desktop bootstrap effect')

          old_save = ''' useEffect(()=>{if(!hydrated)return;const payrollNext=[...payrolls.filter((r:PayrollSnapshot)=>r.month!==payroll.month),payroll];const state={schemaVersion:5,incomeRecords,salesRecords,expenses,products,stocktakes,reminders,saleCategories,expenseCategories,employees,payrolls:payrollNext,suppliers,assets,settings};if(saveTimer.current)clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{if(isDesktop())saveDesktopState(state).catch((e:any)=>setToast(`保存失败：${e.message}`));else localStorage.setItem("restaurant-v1",JSON.stringify(state))},350);return()=>{if(saveTimer.current)clearTimeout(saveTimer.current)}},[hydrated,incomeRecords,expenses,products,reminders,saleCategories,expenseCategories,employees,payroll,salesRecords,stocktakes,suppliers,assets,settings]);'''
          new_save = ''' useEffect(()=>{if(!hydrated||isDesktop())return;const payrollNext=[...payrolls.filter((r:PayrollSnapshot)=>r.month!==payroll.month),payroll],state={schemaVersion:5,incomeRecords,salesRecords,expenses,products,stocktakes,reminders,saleCategories,expenseCategories,employees,payrolls:payrollNext,suppliers,assets,settings};if(saveTimer.current)clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>localStorage.setItem("restaurant-v1",JSON.stringify(state)),350);return()=>{if(saveTimer.current)clearTimeout(saveTimer.current)}},[hydrated,incomeRecords,expenses,products,reminders,saleCategories,expenseCategories,employees,payroll,salesRecords,stocktakes,suppliers,assets,settings]);
 useEffect(()=>{if(!hydrated||!isDesktop())return;const snapshot=JSON.stringify(settings);if(snapshot===settingsSnapshot.current)return;settingsSnapshot.current=snapshot;const timer=setTimeout(()=>patchDesktopSettings(settings).catch((e:any)=>setToast(`设置保存失败：${e.message}`)),250);return()=>clearTimeout(timer)},[hydrated,settings]);
 useEffect(()=>{if(!hydrated||!isDesktop())return;const snapshot=JSON.stringify(saleCategories);if(snapshot===saleCategoriesSnapshot.current)return;saleCategoriesSnapshot.current=snapshot;saveSaleCategoriesV2(saleCategories).catch((e:any)=>setToast(`销售分类保存失败：${e.message}`))},[hydrated,saleCategories]);
 useEffect(()=>{if(!hydrated||!isDesktop())return;const snapshot=JSON.stringify(expenseCategories);if(snapshot===expenseCategoriesSnapshot.current)return;expenseCategoriesSnapshot.current=snapshot;saveExpenseCategoriesV2(expenseCategories).catch((e:any)=>setToast(`支出分类保存失败：${e.message}`))},[hydrated,expenseCategories]);'''
          replace_once(old_save, new_save, 'desktop save effects')

          replace_once(
              ' useEffect(()=>{if(!hydrated||locked||!isDesktop())return;',
              ' useEffect(()=>{if(!hydrated||locked||!isDesktop()||!hasPassword)return;',
              'auto lock guard',
          )
          replace_once(
              '},[hydrated,locked,settings.autoLockMinutes]);',
              '},[hydrated,locked,hasPassword,settings.autoLockMinutes]);',
              'auto lock deps',
          )
          replace_once(
              ' const props={setToast,expenses,setExpenses,products,setProducts,reminders,setReminders,saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,employees,setEmployees,payroll,setPayroll,income,setIncome,incomeRecords,setIncomeRecords,total,salesRecords,setSalesRecords,stocktakes,setStocktakes,suppliers,setSuppliers,assets,setAssets,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate};',
              ' const props={setToast,expenses,setExpenses,products,setProducts,reminders,setReminders,saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,employees,setEmployees,payroll,setPayroll,income,setIncome,incomeRecords,setIncomeRecords,total,salesRecords,setSalesRecords,stocktakes,setStocktakes,suppliers,setSuppliers,assets,setAssets,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate,hasPassword,setHasPassword};',
              'screen props',
          )
          replace_once(
              'onClick={()=>setLocked(true)}>🔒 锁定</button>',
              'onClick={()=>hasPassword?setLocked(true):(setActive("settings"),setToast("请先在系统设置中设置管理员密码"))}>🔒 锁定</button>',
              'manual lock',
          )

          replace_once(
              'function Screen({active,go,setToast,expenses,setExpenses,products,setProducts,reminders,setReminders,saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,employees,setEmployees,payroll,setPayroll,income,setIncome,incomeRecords,setIncomeRecords,total,salesRecords,setSalesRecords,stocktakes,setStocktakes,suppliers,setSuppliers,assets,setAssets,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate}:any){',
              'function Screen({active,go,setToast,expenses,setExpenses,products,setProducts,reminders,setReminders,saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,employees,setEmployees,payroll,setPayroll,income,setIncome,incomeRecords,setIncomeRecords,total,salesRecords,setSalesRecords,stocktakes,setStocktakes,suppliers,setSuppliers,assets,setAssets,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate,hasPassword,setHasPassword}:any){',
              'screen signature',
          )
          replace_once(' if(active==="stocktake")return <Stocktake products={products} stocktakes={stocktakes} setStocktakes={setStocktakes} toast={setToast}/>;', ' if(active==="stocktake")return isDesktop()?<StocktakeV2 toast={setToast}/>:<Stocktake products={products} stocktakes={stocktakes} setStocktakes={setStocktakes} toast={setToast}/>;', 'stocktake screen')
          replace_once(' if(active==="reminders")return <Reminders reminders={reminders} setReminders={setReminders} toast={setToast}/>;', ' if(active==="reminders")return isDesktop()?<RemindersV2 toast={setToast}/>:<Reminders reminders={reminders} setReminders={setReminders} toast={setToast}/>;', 'reminders screen')
          replace_once(' if(active==="payroll")return <Payroll employees={employees} setEmployees={setEmployees} payroll={payroll} setPayroll={setPayroll} toast={setToast}/>;', ' if(active==="payroll")return isDesktop()?<PayrollV2 toast={setToast}/>:<Payroll employees={employees} setEmployees={setEmployees} payroll={payroll} setPayroll={setPayroll} toast={setToast}/>;', 'payroll screen')
          replace_once(' if(active==="suppliers")return <Suppliers suppliers={suppliers} setSuppliers={setSuppliers} toast={setToast}/>;', ' if(active==="suppliers")return isDesktop()?<SuppliersV2 toast={setToast}/>:<Suppliers suppliers={suppliers} setSuppliers={setSuppliers} toast={setToast}/>;', 'suppliers screen')
          replace_once(
              ' return <SettingsReal saleCategories={saleCategories} setSaleCategories={setSaleCategories} expenseCategories={expenseCategories} setExpenseCategories={setExpenseCategories} settings={settings} setSettings={setSettings} appVersion={appVersion} updateInfo={updateInfo} updateChecking={updateChecking} checkUpdate={checkUpdate} toast={setToast}/>;',
              ' return <SettingsReal saleCategories={saleCategories} setSaleCategories={setSaleCategories} expenseCategories={expenseCategories} setExpenseCategories={setExpenseCategories} settings={settings} setSettings={setSettings} appVersion={appVersion} updateInfo={updateInfo} updateChecking={updateChecking} checkUpdate={checkUpdate} hasPassword={hasPassword} onPasswordChanged={()=>setHasPassword(true)} toast={setToast}/>;',
              'settings screen props',
          )
          replace_once(
              'function SettingsReal({saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate,toast}:any){',
              'function SettingsReal({saleCategories,setSaleCategories,expenseCategories,setExpenseCategories,settings,setSettings,appVersion,updateInfo,updateChecking,checkUpdate,hasPassword,onPasswordChanged,toast}:any){',
              'settings signature',
          )
          replace_once(
              'await desktopRequest("password",{method:"POST",body:JSON.stringify({current:passwords.current,new:passwords.next})});setPasswordDialog(false);',
              'await desktopRequest("password",{method:"POST",body:JSON.stringify({current:passwords.current,new:passwords.next})});onPasswordChanged?.();setPasswordDialog(false);',
              'password state callback',
          )
          replace_once(
              '<Panel title="安全设置" sub="自动保存"><p>当前使用单一管理员密码，不建立个人账号和角色权限。程序每次重新打开时会自动锁定。</p>',
              '<Panel title="安全设置" sub={hasPassword?"已设置密码":"未设置密码"}><p>{hasPassword?"当前使用单一管理员密码；程序重新打开或达到无操作时限后会锁定。":"当前尚未设置管理员密码，因此启动和无操作超时不会进入锁屏。设置密码后锁定功能自动启用。"}</p>',
              'security settings copy',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified wiring and remove one-shot workflow
        run: |
          rm .github/workflows/apply-final-v6-wiring.yml
          git config user.name "Q"
          git config user.email "30993382+txdier@users.noreply.github.com"
          git add app/page.tsx .github/workflows/apply-final-v6-wiring.yml
          git commit -m "feat: finish relational desktop wiring and lightweight bootstrap"
          git push origin HEAD:refactor/schema-v6-storage
