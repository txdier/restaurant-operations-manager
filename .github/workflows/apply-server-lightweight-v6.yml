name: Apply lightweight desktop service wiring

on:
  push:
    branches:
      - refactor/schema-v6-storage
    paths:
      - ".github/workflows/apply-server-lightweight-v6.yml"
      - "scripts/apply_server_lightweight_v6.py"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/schema-v6-storage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Apply server codemod
        run: python scripts/apply_server_lightweight_v6.py
      - name: Install backend test dependencies
        run: python -m pip install pytest==8.3.5 openpyxl==3.1.5
      - name: Compile backend
        run: python -m compileall -q desktop/restaurant_manager
      - name: Run v6 backend tests
        env:
          PYTHONPATH: desktop
        run: python -m pytest desktop/tests/test_database.py desktop/tests/test_*v6.py -q
      - name: Commit verified server wiring
        run: |
          rm .github/workflows/apply-server-lightweight-v6.yml scripts/apply_server_lightweight_v6.py
          git config user.name "Q"
          git config user.email "30993382+txdier@users.noreply.github.com"
          git add desktop/restaurant_manager/server.py .github/workflows/apply-server-lightweight-v6.yml scripts/apply_server_lightweight_v6.py
          git commit -m "perf: remove full state reads from desktop settings paths"
          git push origin HEAD:refactor/schema-v6-storage
