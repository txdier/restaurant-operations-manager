name: Apply v2 dashboard and sales

on:
  push:
    branches: [refactor/schema-v6-storage]
    paths:
      - ".github/workflows/apply-v2-dashboard-sales.yml"

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/schema-v6-storage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire dashboard and sales
        shell: python
        run: |
          from pathlib import Path
          path=Path("app/page.tsx")
          text=path.read_text(encoding="utf-8")
          anchor='import ProductsV2 from "./products-v2";'
          replacement=anchor+'\nimport DashboardV2 from "./dashboard-v2";\nimport SalesV2 from "./sales-v2";'
          if text.count(anchor)!=1: raise SystemExit(f"unexpected import anchor count: {text.count(anchor)}")
          text=text.replace(anchor,replacement,1)
          old=' if(active==="dashboard")return <DashboardReal go={go} income={income} incomeRecords={incomeRecords} expenses={expenses} reminders={reminders}/>;'
          new=' if(active==="dashboard")return isDesktop()?<DashboardV2 go={go} toast={setToast}/>:<DashboardReal go={go} income={income} incomeRecords={incomeRecords} expenses={expenses} reminders={reminders}/>;'
          if text.count(old)!=1: raise SystemExit(f"unexpected dashboard route count: {text.count(old)}")
          text=text.replace(old,new,1)
          old=' if(active==="sales")return <Sales incomeRecords={incomeRecords} saleCategories={saleCategories} salesRecords={salesRecords} setSalesRecords={setSalesRecords} toast={setToast}/>;'
          new=' if(active==="sales")return isDesktop()?<SalesV2 toast={setToast}/>:<Sales incomeRecords={incomeRecords} saleCategories={saleCategories} salesRecords={salesRecords} setSalesRecords={setSalesRecords} toast={setToast}/>;'
          if text.count(old)!=1: raise SystemExit(f"unexpected sales route count: {text.count(old)}")
          text=text.replace(old,new,1)
          path.write_text(text,encoding="utf-8")
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit verified wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git rm .github/workflows/apply-v2-dashboard-sales.yml
          git commit -m "refactor: use relational dashboard and sales screens"
          git push origin HEAD:refactor/schema-v6-storage
