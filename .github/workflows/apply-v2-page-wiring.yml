name: Apply v2 page wiring

on:
  push:
    branches: [refactor/schema-v6-storage]
    paths:
      - ".github/workflows/apply-v2-page-wiring.yml"

permissions:
  contents: write

jobs:
  wire-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/schema-v6-storage
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire desktop v2 components
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import {upsertIncomeRecord} from "./income-records.mjs";'
          import_replacement = import_anchor + '\nimport ReportsV2 from "./reports-v2";\nimport DataExchangeV2 from "./data-exchange-v2";'
          if text.count(import_anchor) != 1:
              raise SystemExit(f"unexpected import anchor count: {text.count(import_anchor)}")
          text = text.replace(import_anchor, import_replacement, 1)

          old_reports = ' if(active==="reports")return <ReportsReal expenses={expenses} products={products} incomeRecords={incomeRecords} salesRecords={salesRecords} stocktakes={stocktakes} toast={setToast}/>;'
          new_reports = ' if(active==="reports")return isDesktop()?<ReportsV2 toast={setToast}/>:<ReportsReal expenses={expenses} products={products} incomeRecords={incomeRecords} salesRecords={salesRecords} stocktakes={stocktakes} toast={setToast}/>;'
          if text.count(old_reports) != 1:
              raise SystemExit(f"unexpected reports route count: {text.count(old_reports)}")
          text = text.replace(old_reports, new_reports, 1)

          old_data = ' if(active==="data")return <DataExchange expenses={expenses} toast={setToast}/>;'
          new_data = ' if(active==="data")return isDesktop()?<DataExchangeV2 toast={setToast}/>:<DataExchange expenses={expenses} toast={setToast}/>;'
          if text.count(old_data) != 1:
              raise SystemExit(f"unexpected data route count: {text.count(old_data)}")
          text = text.replace(old_data, new_data, 1)

          path.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit verified wiring and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git rm .github/workflows/apply-v2-page-wiring.yml
          git commit -m "refactor: use relational v2 reports and data exchange"
          git push origin HEAD:refactor/schema-v6-storage
