name: Final schema v6 validation

on:
  push:
    branches:
      - refactor/schema-v6-storage
    paths:
      - ".github/workflows/final-v6-validation.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: python -m pip install pytest==8.3.5 openpyxl==3.1.5
      - run: python -m compileall -q desktop/restaurant_manager
      - env:
          PYTHONPATH: desktop
        run: python -m pytest desktop/tests/test_database.py desktop/tests/test_*v6.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
