name: Verify Windows schema v6 build fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-windows-v6-build.yml"
      - "scripts/fix_windows_v6_build.py"

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64
      - name: Apply fixes
        run: python scripts/fix_windows_v6_build.py
      - name: Install focused test dependencies
        run: python -m pip install pytest==8.3.5 Pillow==10.4.0
      - name: Verify Windows migration and data exchange tests
        env:
          PYTHONPATH: desktop
        run: python -m pytest desktop/tests/test_database.py::test_old_state_is_migrated_through_candidate_and_keeps_backup desktop/tests/test_static_content.py::test_data_exchange_is_combined_and_navigation_labels_use_four_characters -q
      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/fix-windows-v6-build.yml scripts/fix_windows_v6_build.py
          git config user.name "Q"
          git config user.email "30993382+txdier@users.noreply.github.com"
          git add desktop/restaurant_manager/database.py desktop/tests/test_static_content.py .github/workflows/fix-windows-v6-build.yml scripts/fix_windows_v6_build.py
          git commit -m "fix: close migration snapshots on Windows"
          git push origin HEAD:main
