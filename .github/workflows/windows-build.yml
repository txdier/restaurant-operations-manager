name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "desktop/**"
      - "desktop-ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 7+ x64 package
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements-win7.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Read application version
        shell: powershell
        run: |
          $manifest = Get-Content desktop/app-manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          "APP_NAME=$($manifest.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test installer
        shell: cmd
        run: desktop\build_windows.bat

      - name: Build incremental update package
        shell: powershell
        run: |
          python desktop/make_update.py --version $env:APP_VERSION --min-version 1.0.0
          Copy-Item dist/RestaurantManagerUpdater.exe release/RestaurantManagerUpdater.exe
          Copy-Item desktop/ApplyUpdate.bat release/ApplyUpdate.bat

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantManager-Windows-${{ env.APP_VERSION }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { "v$env:APP_VERSION" }
          $title = "$env:APP_NAME $env:APP_VERSION"
          cmd /c "gh release view $tag >nul 2>nul"
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Release $tag already exists; uploading current Windows packages."
            gh release upload $tag release/* --clobber
            exit $LASTEXITCODE
          }
          gh release create $tag release/* --target $env:GITHUB_SHA --title $title --generate-notes
          exit $LASTEXITCODE
